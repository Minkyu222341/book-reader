<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>북 리더</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="북리더">
<meta name="theme-color" content="#1a120a">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./vendor/page-flip.css">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>

<div id="loader" style="position:fixed;inset:0;background:#1a120a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;color:#f4ecd8;">
    <div style="font-family:'Nanum Myeongjo',serif;font-size:34px;letter-spacing:0.2em;margin-bottom:8px;font-weight:800;color:#b08d3a;">북 리더</div>
    <div style="font-family:'Cormorant Garamond',serif;font-style:italic;color:#8a7758;letter-spacing:0.1em;margin-bottom:36px;">Book Reader</div>
    <div style="width:200px;height:1px;background:rgba(255,255,255,0.15);overflow:hidden;position:relative;">
        <div style="position:absolute;inset:0;background:#b08d3a;transform:translateX(-100%);animation:lb 1.4s ease-in-out infinite;"></div>
    </div>
</div>
<style>@keyframes lb { 50%{transform:translateX(0)} 100%{transform:translateX(100%)} }</style>

<div id="app-content"></div>
<div id="toast"></div>

<script type="module" src="./src/main.js"></script>

</body>
</html>
